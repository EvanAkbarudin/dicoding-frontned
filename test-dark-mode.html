<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark Mode Test</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen p-8 transition-colors">
  <div class="max-w-2xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-800 dark:text-gray-100 mb-4">
      Dark Mode Test
    </h1>
    
    <button 
      id="toggleBtn"
      class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700"
    >
      Toggle Dark Mode
    </button>

    <div class="mt-8 p-6 bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700">
      <p class="text-gray-700 dark:text-gray-300">
        Ini adalah test dark mode. Klik tombol di atas untuk toggle.
      </p>
      <p class="text-sm text-gray-500 dark:text-gray-400 mt-2">
        Current theme: <span id="themeStatus">light</span>
      </p>
    </div>
  </div>

  <script>
    const html = document.documentElement;
    const btn = document.getElementById('toggleBtn');
    const status = document.getElementById('themeStatus');

    // Load saved theme
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
      html.classList.add('dark');
      status.textContent = 'dark';
    }

    btn.addEventListener('click', () => {
      html.classList.toggle('dark');
      const isDark = html.classList.contains('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      status.textContent = isDark ? 'dark' : 'light';
    });
  </script>
</body>
</html>
